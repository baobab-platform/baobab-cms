# Baobab Capability Provider Declaration: baobab-cms
#
# Conforms to:
#   baobab-platform/shared/contracts/capability/v1/provider-declaration.schema.json
# Governing decision:
#   baobab-platform/shared ADR-SHARED-017 (EA-02), G-FCI-1 (an active engine
#   declares what it provides)
#
# Declares which canonical Baobab capabilities this engine's providers
# implement or plan. It references Shared's catalogue.yaml; it defines no
# capability. It does not state certification (EA-09), activation,
# bindings, grants, engine instances or health: the Control Plane owns
# those.
#
# The three .baobab contracts are distinct:
#   repository.yaml          Foundation technical traits
#   environment.yaml         baobab-dev toolchain
#   capability-provider.yaml canonical capability support  <- this file
#
# Census (EA-02A), candidate review (EA-02B) and contract work (EA-02C):
#   content.entry.resolve is canonical, with Shared content/v1 as its
#     contract (content-resolve-request / content-resolve-response). The
#     resolver in src/baobab/content-resolution is real and implements the
#     ADR-0014 specificity, inheritance and fallback rules, but no route
#     accepts ContentResolveRequest or answers ContentResolveResponse yet,
#     so the capability is planned (CONTRACTED), not claimed as support.
#     The contract handler (request validation, tenant check against trusted
#     context, resolution, contract-shaped response and problem details) is
#     implemented and tested in src/baobab/content-resolution/contract.ts.
#     What remains is the HTTP route and its authentication, which wait for
#     Shared to publish an OpenAPI surface for content/v1.
#     Move it into providers[].support for baobab-cms.payload, with the
#     route and its contract tests as evidence, once it does.
#
# Validate with a Shared checkout:
#   python3 <shared>/scripts/capability_catalogue.py validate-declaration \
#     .baobab/capability-provider.yaml --engine-id baobab-cms --repository-root .

schema:
  name: baobab-capability-provider-declaration
  version: "1.0"

engine:
  engine_id: baobab-cms

planned_capabilities:
  - capability_key: content.entry.resolve
    proposal_status: CONTRACTED
    description: >
      Resolve one content entry deterministically for a market, locale and
      digital estate context through the content/v1 contract, with the
      ADR-0014 inheritance and fallback provenance.
    target_provider_key: baobab-cms.payload
    provenance:
      authority:
        repository: baobab-platform/baobab-cms
        decision: ADR-0014
