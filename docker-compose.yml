services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baobab-cms
    environment:
      NODE_ENV: development
      PORT: 3000
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-super-secret-change-me}
      PAYLOAD_JWT_SECRET: ${PAYLOAD_JWT_SECRET:-jwt-secret-change-me}
      DATABASE_URL: postgresql://payload:payload@postgres:5432/payload
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CORS_ORIGIN: http://localhost:3000
      CSRF_ORIGIN: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: baobab-media
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: baobab-postgres
    environment:
      POSTGRES_DB: payload
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
    ports:
      - '5432:5432'
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      # Payload's postgres adapter uses a non-default schema (ADR-0020
      # §19-25) and expects it to already exist.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: baobab-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for media (ADR-0016 §10-13). Production
  # deployments point S3_ENDPOINT at a real S3-compatible service instead.
  minio:
    image: minio/minio:latest
    container_name: baobab-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: baobab-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/baobab-media &&
      exit 0
      "

volumes:
  postgres17_data:
  minio_data:
