# The baobab-platform/shared contracts this engine implements or consumes
# (EA Plan v2.0 EA-01A; schema: shared .baobab/contract-consumer-lock.schema.json).
# Foundation checks that the commit is on Shared main and that every listed
# contract exists and parses there, and reports drift in the job summary.
schema: baobab-contract-consumer-lock
version: "1.0"
source:
  repository: baobab-platform/shared
  commit: 8f3f847dd6c1ecfe32deea808c298e0f910cbc59
contracts:
  # content.entry.resolve, declared PARTIAL in .baobab/capability-provider.yaml.
  - contracts/content/v1/capabilities.yaml
  # Its contract 1 request and response, implemented by the POST /v1/content/resolve
  # route (src/baobab/content-resolution).
  - contracts/content/v1/content-resolve-request.schema.json
  - contracts/content/v1/content-resolve-response.schema.json
  # The HTTP contract of that route: path, context_id query parameter, scopes
  # (content:entry:resolve, content:entry:preview) and error responses.
  - contracts/content/v1/openapi.yaml
  # Consumed by the route's Control Plane context validation call
  # (POST /platform-context/validate).
  - contracts/control-plane/v1/openapi.yaml
  # The workload access-token claims the route's caller authenticator requires
  # (iss, sub, aud, exp, iat, jti, scope, actor_type).
  - contracts/control-plane/v1/access-token-claims.schema.json
policy:
  updates: explicit_pull_request
  compatibility: validate_before_merge
